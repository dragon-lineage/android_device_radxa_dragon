set gfxmode=auto
set gfxpayload=keep
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
    loadfont /boot/grub/fonts/unicode.pf2
    terminal_output gfxterm
fi

function boot_android {
    echo 'Loading kernel...'
    linux /@BOOTMGR_ANDROID_DIR_NAME@/kernel @STRIPPED_BOARD_KERNEL_CMDLINE@ androidboot.android_dir=@BOOTMGR_ANDROID_DIR_NAME@ $@
    echo 'Loading ramdisk...'
    initrd /@BOOTMGR_ANDROID_DIR_NAME@/ramdisk-all-combined.img
    echo 'Loading device tree...'
    devicetree /@BOOTMGR_ANDROID_DIR_NAME@/qcs6490-radxa-dragon-q6a.dtb
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live" {
    boot_android androidboot.console=tty0 androidboot.mount_system=imgs androidboot.mount_userdata=tmpfs
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (serial console)" {
    boot_android @STRIPPED_BOARD_KERNEL_CMDLINE_SERIAL_CONSOLE@ androidboot.mount_system=imgs androidboot.mount_userdata=tmpfs
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ Live (copy system to RAM)" {
    boot_android androidboot.console=tty0 androidboot.mount_system=imgs_ram androidboot.mount_userdata=tmpfs
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Firmware setup" {
        fwsetup
    }
fi

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
