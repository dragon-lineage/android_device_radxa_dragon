set default=0
set timeout=5
set timeout_style=menu

set gfxmode=auto
set gfxpayload=keep
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
    loadfont /boot/grub/fonts/unicode.pf2
    terminal_output gfxterm
fi

function boot_android {
    echo 'Loading kernel...'
    linux /@BOOTMGR_ANDROID_DIR_NAME@/kernel @STRIPPED_BOARD_KERNEL_CMDLINE@ $@ androidboot.mount_system=std_parts androidboot.mount_userdata=std_parts
    echo 'Loading ramdisk...'
    initrd /@BOOTMGR_ANDROID_DIR_NAME@/ramdisk-all-combined.img
    echo 'Loading device tree...'
    devicetree /@BOOTMGR_ANDROID_DIR_NAME@/qcs6490-radxa-dragon-q6a.dtb
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@" {
    boot_android androidboot.console=tty0
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ (serial console)" {
    boot_android @STRIPPED_BOARD_KERNEL_CMDLINE_SERIAL_CONSOLE@
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Firmware setup" {
        fwsetup
    }
fi

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
