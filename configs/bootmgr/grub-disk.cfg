set default=0
set timeout=5
set timeout_style=menu

set gfxmode=auto
set gfxpayload=keep
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
    loadfont /boot/grub/fonts/unicode.pf2
    terminal_output gfxterm
fi

function boot_android {
    echo 'Loading kernel...'
    linux /payload/kernel @STRIPPED_BOARD_KERNEL_CMDLINE@ androidboot.android_dir=payload androidboot.mount_system=imgs androidboot.mount_userdata=std_parts androidboot.mount_firmware=only_android_dir $@
    echo 'Loading ramdisk...'
    initrd /payload/ramdisk-all-combined.img
    echo 'Loading device tree...'
    devicetree /payload/qcs6490-radxa-dragon-q6a.dtb
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@" {
    boot_android androidboot.console=tty0
}

menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ (serial console)" {
    boot_android @STRIPPED_BOARD_KERNEL_CMDLINE_SERIAL_CONSOLE@
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Firmware setup" {
        fwsetup
    }
fi

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
